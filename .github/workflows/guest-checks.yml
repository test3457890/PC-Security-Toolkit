name: Guest safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guest-http:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fixture HTTP and syntax tests
        run: python -m unittest discover -s Tests -p "test_*.py" -v
  powershell-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse and test request policy without OS changes
        shell: powershell
        run: '& "./Tests/Guest Policy Tests.ps1"'
